name: historiasclinicas_net
description: "historiasclinicas.net — historia clínica y receta offline en el navegador."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
