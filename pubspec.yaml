name: historiasclinicas_net
description: "historiasclinicas.net — historia clínica y receta offline en el navegador."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  json_schema: ^5.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cie10/cie10_sispro.txt
    - assets/ihce/catalogos_guia.json
    - assets/ihce/fhir.schema.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
